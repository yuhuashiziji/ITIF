<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITIF 信息台 · 融合版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1d21'/%3E%3Cpath d='M9 22c3-7 1-10 4-14 1 3 2 4 4 6-1-5 0-7 2-9 2 5 2 8 2 11 0 1-2 2-4 2-3 0-6-1-8-2-1 0-1-1-1-1z' fill='%23dc2626'/%3E%3Crect x='20' y='14' width='3' height='11' rx='1.5' fill='%231e40af'/%3E%3C/svg%3E">
<style>
/* ============ 设计系统：极简瑞士风 · 编辑部红蓝 ============
   主色 #DC2626（热度/涨跌/重点）  链接蓝 #1E40AF（交互/链接）
   暖纸感背景 · 发丝分隔线 · tabular 数字 · 高密度布局      */
:root{
  --bg:#f7f5f1; --bg-2:#efebe4; --panel:#ffffff; --line:#e4e0d8; --line-2:#efece6;
  --text:#1a1d21; --text-2:#565d66; --sub:#8b919a;
  --brand:#dc2626; --brand-d:#b91c1c; --brand-soft:rgba(220,38,38,.08);
  --link:#1e40af; --link-d:#1e3a8a; --link-soft:rgba(30,64,175,.08);
  --up:#dc2626; --down:#0e9f6e; --gold:#b45309; --rank:#9aa0a8;
  --shadow:0 1px 2px rgba(25,25,25,.04),0 3px 12px rgba(25,25,25,.05);
}
html[data-theme="dark"]{
  --bg:#131518; --bg-2:#181b1f; --panel:#1c1f24; --line:#2b2f36; --line-2:#24282e;
  --text:#e9ebee; --text-2:#a3a9b1; --sub:#767d86;
  --brand:#f05252; --brand-d:#ef4444; --brand-soft:rgba(240,82,82,.14);
  --link:#60a5fa; --link-d:#3b82f6; --link-soft:rgba(96,165,250,.14);
  --up:#f05252; --down:#2fc48f; --gold:#f2b04c; --rank:#6d747e;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:14px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
.ic{width:15px;height:15px;flex:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== 顶部导航 ===== */
.topbar{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:800;color:var(--text);letter-spacing:.01em}
.brand svg{width:24px;height:24px;flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav-item{position:relative;padding:9px 14px 10px;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;transition:color .2s}
.nav-item svg{width:14px;height:14px}
.nav-item:hover{color:var(--text)}
.nav-item.on{color:var(--text);font-weight:700}
.nav-item.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--brand)}
.nav-item .mini{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--bg-2);color:var(--text-2)}
.nav-item.on .mini{background:var(--brand-soft);color:var(--brand)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.search{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;gap:6px;transition:border-color .2s}
.search:focus-within{border-color:var(--link)}
.search input{border:none;background:none;outline:none;font-size:16px;width:160px;color:var(--text)}
.search svg{width:15px;height:15px;stroke:var(--sub);flex:none}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--line);transition:all .2s}
.icon-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.icon-btn svg{width:16px;height:16px}

/* ===== 视图容器 ===== */
.view{display:none}
.view.show{display:block}
.wrap{max-width:1320px;margin:0 auto;padding:18px;align-items:start}

/* ===== 快捷入口行 ===== */
.quick-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.quick{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:11px 13px;display:flex;align-items:center;gap:11px;text-align:left;transition:border-color .2s,transform .2s}
.quick:hover{border-color:var(--brand);transform:translateY(-1px)}
.quick .qico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:none}
.quick .qt{font-size:13px;font-weight:700}
.quick .qs{font-size:11px;color:var(--sub);margin-top:1px}

/* ===== 首页主体 ===== */
.home-main{display:grid;grid-template-columns:1fr 292px;gap:16px;align-items:start}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.tag{padding:4px 13px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--text-2);transition:all .2s}
.tag:hover{border-color:var(--brand);color:var(--brand)}
.tag.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1240px){.grid{grid-template-columns:repeat(4,1fr)}}
.empty{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--sub);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--rank)}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.site-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;flex:none}
.card-head .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.card-head .bd{font-size:10.5px;color:var(--sub)}
.card-body{padding:5px 0;flex:1}
.row{display:flex;gap:10px;align-items:baseline;padding:6.5px 14px;border-radius:5px;transition:background .15s}
.row:hover{background:var(--bg)}
.row .rn{font-size:11.5px;color:var(--rank);min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.row .rn.top{color:var(--brand);font-weight:800}
.row .tt{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.row .ht{font-size:11px;color:var(--rank);white-space:nowrap;font-variant-numeric:tabular-nums}
.card-foot{padding:7px 14px;border-top:1px solid var(--line-2);text-align:center}
.card-foot button{font-size:12px;color:var(--link);padding:3px 14px;border-radius:6px;transition:background .15s}
.card-foot button:hover{background:var(--link-soft)}

/* ===== 首页侧栏 ===== */
.side{display:flex;flex-direction:column;gap:13px;position:sticky;top:74px}
.side-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:13px}
.side-card h3{font-size:13px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px;letter-spacing:.02em}
.side-card h3::before{content:"";width:3px;height:13px;border-radius:1px;background:var(--brand)}
.top-item{display:flex;gap:9px;align-items:baseline;padding:5.5px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.top-item:last-child{border-bottom:none}
.top-item .n{font-weight:800;font-size:11.5px;min-width:15px;font-variant-numeric:tabular-nums}
.top-item .n.c1{color:var(--brand)}.top-item .n.c2{color:var(--gold)}.top-item .n.c3{color:var(--text-2)}
.top-item .s{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-item .h{color:var(--rank);font-size:11px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag-cloud{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-2);background:var(--bg);transition:all .2s}
.tag-cloud:hover{color:var(--brand);border-color:var(--brand)}
.src-status{display:flex;flex-direction:column;gap:7px}
.src-item{display:flex;align-items:center;gap:8px;font-size:12px}
.src-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
.src-item .dot.ok{background:var(--down)}.src-item .dot.warn{background:var(--gold)}
.src-item .sn{flex:1;color:var(--text)}
.src-item .st{color:var(--rank);font-size:11px}

/* ===== 工作台 ===== */
.greet{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.greet h1{font-size:20px;font-weight:800;letter-spacing:.01em}
.greet .sub{font-size:12.5px;color:var(--sub);margin-top:3px}
.greet-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.weather{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 13px;box-shadow:var(--shadow)}
.weather .w-ico{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#f2b04c,#d97706);display:grid;place-items:center;color:#fff}
.weather .t{font-size:14px;font-weight:700}
.weather .d{font-size:11px;color:var(--sub)}
.add-widget{padding:7px 14px;border-radius:8px;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:600;transition:opacity .2s;display:flex;align-items:center;gap:5px}
html[data-theme="dark"] .add-widget{background:var(--text);color:var(--bg)}
.add-widget:hover{opacity:.82}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}
.w{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
.w:hover{border-color:var(--rank)}
.w-a{grid-column:span 3}
.w-c{grid-column:span 3}
@media(max-width:900px){.w-a,.w-c{grid-column:span 6}}
.w-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.w-head .dot{width:8px;height:8px;border-radius:2px;flex:none}
.w-head h3{font-size:13.5px;font-weight:700;flex:1;letter-spacing:.01em}
.w-head .hint{font-size:10.5px;color:var(--sub)}
.w-body{padding:7px 0}
.hot-row{display:flex;gap:9px;align-items:baseline;padding:5.5px 14px;font-size:12.5px}
.hot-row .rn{color:var(--rank);font-size:11px;min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.hot-row .rn.t{color:var(--brand);font-weight:800}
.hot-row .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-row .h{color:var(--rank);font-size:10.5px;font-variant-numeric:tabular-nums}
.hot-sec .lab{padding:5px 14px 1px;font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.05em}
.stocks,.coins{padding:2px 14px 8px}
.stock,.coin{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line-2)}
.stock:last-child,.coin:last-child{border-bottom:none}
.stock .nm,.coin .nm{font-size:12.5px;font-weight:600}
.stock .code,.coin .code{font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.stock .px,.coin .px{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-size:11.5px;font-weight:700;padding:2.5px 8px;border-radius:5px;color:#fff;text-align:center;min-width:58px;font-variant-numeric:tabular-nums}
.chg.up{background:var(--up)}.chg.down{background:var(--down)}
.spark{grid-column:1/-1;height:28px;margin-top:2px}
.ql{padding:0 14px 9px;font-size:11px;color:var(--sub)}
.ql .ql-row{display:flex;justify-content:space-between;padding:2px 0}
.ql .ql-row b{font-weight:700}
.cal-item{display:grid;grid-template-columns:42px 1fr;gap:9px;padding:6px 14px}
.cal-time{font-size:11px;color:var(--sub);padding-top:1px;text-align:right;font-variant-numeric:tabular-nums}
.cal-item .ev{font-size:12px}
.cal-item .ev .tag{display:inline-block;font-size:9.5px;color:#fff;border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px}
.sub{display:flex;align-items:center;gap:8px;padding:5.5px 14px;font-size:12px}
.sub .sico{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;flex:none}
.sub .nm{flex:1}
.sub .st{font-size:10.5px;color:var(--sub)}
.sub .st.new{color:var(--brand)}
.note-item{display:flex;gap:8px;align-items:flex-start;padding:5.5px 14px;font-size:12px}
.note-item::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-top:5px;flex:none}
.gh-item{display:flex;flex-direction:column;gap:1px;padding:6px 14px;border-bottom:1px dashed var(--line-2)}
.gh-item:last-child{border-bottom:none}
.gh-item .repo{font-size:12px;font-weight:600}
.gh-item .repo .lang{font-size:9.5px;color:var(--sub);font-weight:400;margin-left:5px}
.gh-item .meta{font-size:10.5px;color:var(--sub);display:flex;gap:9px;align-items:center}
.gh-item .meta .st{color:var(--rank);display:flex;align-items:center}

/* ===== 订阅源视图 ===== */
.subs-page h2{font-size:17px;font-weight:800;margin-bottom:4px;letter-spacing:.01em}
.subs-page .sub2{font-size:12.5px;color:var(--sub);margin-bottom:14px}
.subs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sub-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;transition:border-color .2s}
.sub-card:hover{border-color:var(--rank)}
.sub-card .sc-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.sub-card .sc-head .sico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.sub-card .sc-head .sn{font-size:13px;font-weight:700;flex:1}
.sub-card .sc-head .badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge.ok{background:rgba(14,159,110,.12);color:var(--down)}
.badge.warn{background:rgba(180,83,9,.12);color:var(--gold)}
.sub-card .sc-desc{font-size:11.5px;color:var(--text-2);line-height:1.7;margin-bottom:9px}
.sub-card .sc-meta{font-size:11px;color:var(--rank);display:flex;gap:12px;flex-wrap:wrap}

/* ===== 页脚 ===== */
.footer{max-width:1320px;margin:20px auto 0;padding:0 18px 30px;font-size:12px;color:var(--rank);line-height:1.8}

/* ===== 弹层 / Toast ===== */
.mask{position:fixed;inset:0;background:rgba(15,17,20,.5);display:none;align-items:center;justify-content:center;z-index:100}
.mask.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px;width:min(420px,92vw);box-shadow:0 16px 48px rgba(0,0,0,.22)}
.dialog h4{font-size:15px;margin-bottom:12px}
.dialog label{display:block;font-size:12px;color:var(--sub);margin:11px 0 5px}
.dialog input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.dialog input:focus{border-color:var(--link)}
.wpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wpick button{text-align:left;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:12px;color:var(--text);transition:all .15s}
.wpick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.wpick button .wn{display:block;font-weight:700;margin-bottom:2px}
.wpick button .wd{font-size:10.5px;color:var(--sub)}
.dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.dlg-btn{padding:6px 15px;border-radius:8px;font-size:13px}
.dlg-btn.ghost{color:var(--text-2)}
.dlg-btn.ghost:hover{background:var(--bg)}
.dlg-btn.solid{background:var(--brand);color:#fff}
.dlg-btn.solid:hover{background:var(--brand-d)}
.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);font-size:12.5px;padding:7px 17px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== 移动端 ===== */
@media(max-width:1020px){.home-main{grid-template-columns:1fr}.side{position:static}.quick-row{grid-template-columns:repeat(3,1fr)}.subs-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .quick-row{grid-template-columns:repeat(2,1fr)}
  .subs-grid{grid-template-columns:1fr}
  .board{padding:0}
  .search input{width:105px}
  .wrap{padding:12px}
}
.reader-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}.reader-hint{color:var(--sub);font-size:12px}.reader-entry{flex:1;min-width:0;display:flex;gap:8px;align-items:center}.reader-entry>.tt{flex:1;min-width:0}.reader-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;font-size:12px}.reader-star{border:0;background:none;color:var(--brand);cursor:pointer;font-size:18px}.reader-read>.tt{opacity:.58}.reader-pin{margin-left:auto;flex-shrink:0}@media(max-width:700px){.reader-hint{display:none}.top-right{flex-wrap:wrap}.reader-actions{gap:3px}}
.editor-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.editor-panel{max-width:1000px;margin:24px auto}.editor-panel>h2{margin-bottom:12px}.editor-panel p{line-height:1.7;color:var(--sub)}.editor-item{border-bottom:1px solid var(--line);padding:20px 0;overflow-wrap:anywhere}.editor-item h3{margin:8px 0}.editor-item summary{cursor:pointer;line-height:1.6}.editor-panel label{display:inline-flex;flex-direction:column;gap:6px;margin:10px 12px 10px 0}.editor-panel input,.editor-panel select{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px;max-width:100%}.source-fields{display:flex;gap:8px;flex-wrap:wrap}.source-fields input[type=number]{width:110px}.editor-settings{padding:24px 0}.editor-reason{font-size:13px}[hidden]{display:none!important}
.rss-drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(620px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;padding:0;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--text);box-shadow:-12px 0 48px #0002}.rss-drawer::backdrop{background:#0006}.rss-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.rss-drawer-head h2{font-size:20px}.rss-drawer-body{padding:8px 24px 32px}.rss-source{padding:16px 0;border-bottom:1px solid var(--line)}.rss-source>summary{cursor:pointer;font-weight:600}.rss-source .row{padding:12px 0;height:auto;min-height:44px}.rss-drawer .tt{white-space:normal;line-height:1.6}.rss-drawer .reader-actions{flex-shrink:0}
</style>

</head>
<body>

<header class="topbar">
  <div class="topbar-in">

function sparkPts(d){ var mx=Math.max.apply(null,d), mn=Math.min.apply(null,d), sp=(mx-mn)||1; return d.map(function(v,i){ return (i/(d.length-1)*100).toFixed(1)+","+(24-((v-mn)/sp)*20).toFixed(1); }).join(" "); }

/* ============ 路由 ============ */
function go(route){

  if(route==="subs") renderSubs();
  window.scrollTo(0,0);
}

function visibleNodes(){
  return NODES.filter(function(n){
    if(state.cat==="all") return n.all;
    if(state.cat!=="all" && n.cat!==state.cat && !(state.cat==="dev"&&n.id==="gh")) return false;
    return true;
  });
}
function matchItem(row){ if(!state.q) return true; return row[0].toLowerCase().indexOf(state.q.toLowerCase())>-1; }
function tt(it){
  var title=it[2] || it[0];
  if(!/^https?:\/\//i.test(it[3] || "")) return '<span class="tt" title="暂无原文地址">'+esc(title)+' <small>暂无链接</small></span>';
  return '<a class="tt" href="'+esc(it[3])+'" target="_blank" rel="noopener noreferrer" title="打开原文">'+esc(title)+'</a>';
}

function renderGrid(){
  var nodes = visibleNodes(), h = "";
  nodes.forEach(function(n){
    var items = n.items.filter(matchItem), shown = items.slice(0,5), more = items.length>5;
    if(state.q && !items.length) return;
    var ico = n.color || ICONS[n.name] || "#1e40af";
    h += '<article class="card" data-node="'+esc(n.id)+'"'+(n.private?' translate="no" data-private="true"':'')+'><div class="card-head"><div class="site-ico" style="background:'+ico+'">'+esc(n.name.slice(0,1))+'</div><div><div class="nm">'+esc(n.name)+'</div><div class="bd">'+esc(n.board)+'</div></div></div><div class="card-body">';
    shown.forEach(function(it,i){ h += '<div class="row"><span class="rn'+(i<3?" top":"")+'">'+(i+1)+'</span>'+tt(it)+'<span class="ht">'+esc(it[1])+'</span></div>'; });
    if(!shown.length) h += '<div class="empty">'+esc(n.error||'来源正在更新，请稍后查看')+'</div>';
    h += '</div>';
    if(more) h += '<div class="card-foot"><button class="more-btn" data-node="'+n.id+'">展开全部 '+items.length+' 条</button></div>';
    h += '</article>';
  });
  $("grid").innerHTML = h || '<div class="empty" role="status">'+(state.q?'没有匹配的新闻，试试其他关键词。':'当前分类暂无榜单')+'</div>';
}

    if(state.hide.indexOf(w.id)>-1) return;
    h += '<section class="w '+w.size+'" data-w="'+w.id+'"><div class="w-head"><span class="dot" style="background:'+w.color+'"></span><h3>'+w.name+'</h3><span class="hint">'+w.hint+'</span>'+
      '<button class="icon-btn" data-fold="'+w.id+'" style="width:25px;height:25px" title="收起" aria-label="收起"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button></div>'+
      '<div class="w-body">'+w.render()+'</div></section>';
  });
  $("board").innerHTML = h;
}
function renderPick(){
  var h = "";
  WIDGETS.forEach(function(w){
    var hidden = state.hide.indexOf(w.id)>-1;
    h += '<button data-w="'+w.id+'"><span class="wn" style="color:'+w.color+'">'+w.name+'</span><span class="wd">'+(hidden?"已隐藏，点击恢复":"当前显示，点击隐藏")+'</span></button>';
  });
  $("wpick").innerHTML = h;
}
function greet(){
  var d = new Date(), hh = d.getHours();
  var g = hh<6?"夜深了":hh<9?"早上好":hh<12?"上午好":hh<14?"中午好":hh<18?"下午好":"晚上好";
  var wd = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];
  $("greetLine").textContent = g+"，今天"+wd;
  $("greetSub").textContent = (d.getMonth()+1)+"月"+d.getDate()+"日 · 你的专属信息工作台";
}

/* ============ 订阅源 ============ */
function renderSubs(){
  var h = "";
  SUBSOURCES.forEach(function(s){
    h += '<div class="sub-card"><div class="sc-head"><span class="sico" style="background:'+s.c+'">'+s.sico+'</span><span class="sn">'+esc(s.name)+'</span><span class="badge '+(s.status==="ok"?"ok":"warn")+'">'+(s.status==="ok"?"已接入":"待接入")+'</span></div>'+
      '<div class="sc-desc">'+esc(s.desc)+'</div>'+
      '<div class="sc-meta">'+s.meta.map(esc).join(" · ")+'</div>'+
      (s.url && /^https?:\/\//i.test(s.url)?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">打开订阅地址</a>':'')+
      (s.id==="custom"?'<div style="margin-top:10px"><button class="add-widget" data-addsub style="padding:5px 12px;font-size:12px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:12px;height:12px"><path d="M12 5v14M5 12h14"/></svg>添加订阅源</button></div>':"")+'</div>';
  });
  $("subsGrid").innerHTML = h;
}

/* ============ 事件 ============ */
document.addEventListener("click", function(e){
  var b;
  if((b=e.target.closest(".nav-item"))){
    location.hash = "#/" + b.dataset.view; parseHash(); return;
  }
  if((b=e.target.closest("[data-to]"))){ location.hash = "#/"+b.dataset.to; parseHash(); return; }
  if((b=e.target.closest(".tag")) && $("view-home").classList.contains("show")){
    if(b.dataset.cat){ state.cat = b.dataset.cat; renderTabs(); renderGrid(); return; }
  }
  if((b=e.target.closest(".tag-cloud"))){
    state.q = b.dataset.tag; $("q").value = b.dataset.tag; renderGrid(); return;
  }
  if((b=e.target.closest(".more-btn"))){
    var n = visibleNodes().find(function(x){return x.id===b.dataset.node;});
    if(!n) return;
    var items = n.items.filter(matchItem);
    var ico = n.color || ICONS[n.name] || "#1e40af";
    var rows = items.map(function(it,i){ return '<div class="row"><span class="rn'+(i<3?" top":"")+'">'+(i+1)+'</span>'+tt(it)+'<span class="ht">'+esc(it[1])+'</span></div>'; }).join("");
    var card = b.closest(".card");
    card.querySelector(".card-body").innerHTML = rows;
    b.closest(".card-foot").remove();
    return;
  }
  if((b=e.target.closest("[data-fold]"))){
    state.hide.push(b.dataset.fold); renderBoard(); toast("组件已收起，可点「添加组件」恢复"); return;
  }
  if((b=e.target.closest(".wpick button"))){
    var id = b.dataset.w, i = state.hide.indexOf(id);
    if(i>-1) state.hide.splice(i,1); else state.hide.push(id);
    renderBoard(); renderPick(); toast(state.hide.indexOf(id)>-1?"组件已收起":"组件已恢复"); return;
  }
});
$("q").addEventListener("input", function(e){ state.q = e.target.value.trim(); renderGrid(); });
$("refreshBtn").addEventListener("click", function(e){
  var btn = e.currentTarget;
  btn.style.transition = "transform .5s"; btn.style.transform = "rotate(360deg)";
  setTimeout(function(){ btn.style.transition = "none"; btn.style.transform = "rotate(0deg)"; }, 520);
  setTimeout(function(){ location.reload(); }, 520);
});
$("themeBtn").addEventListener("click", function(){
  state.dark = !state.dark;
  document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
});
$("addWidgetBtn").addEventListener("click", function(){ renderPick(); $("widgetDialog").classList.add("show"); });
$("wClose").addEventListener("click", function(){ $("widgetDialog").classList.remove("show"); });
$("subsGrid").addEventListener("click", function(e){
  var b = e.target.closest("[data-addsub]");
  if(b) $("subDialog").classList.add("show");
});
$("subOk").addEventListener("click", function(){
  var n = $("subName").value.trim(), u = $("subUrl").value.trim();
  if(!n || !u){ toast("请填写订阅源名称和地址"); return; }
  if(!/^https?:\/\//i.test(u)){ toast("请输入 http 或 https 地址"); return; }
  var source={name:n, url:u, sico:"R", c:"#0e9f6e", status:"pending", st:"自定义", desc:"已保存地址，尚未接入自动抓取", meta:["手动添加"]};
  var saved=readSavedSources(); saved.push(source);
  try { localStorage.setItem("daily-custom-sources",JSON.stringify(saved)); } catch(e){ toast("浏览器无法保存订阅源，请检查存储权限"); return; }
  SUBSOURCES.push(source);
  $("subDialog").classList.remove("show"); $("subName").value=""; $("subUrl").value="";
  renderSubs(); toast("已添加订阅源："+n+"（地址已保存）");
});
$("subCancel").addEventListener("click", function(){ $("subDialog").classList.remove("show"); });
document.querySelectorAll(".mask").forEach(function(m){
  m.addEventListener("click", function(e){ if(e.target===this) this.classList.remove("show"); });
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") document.querySelectorAll(".mask").forEach(function(m){m.classList.remove("show");}); });
window.addEventListener("hashchange", parseHash);

function toast(msg){
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){t.remove();},320); }, 2200);
}

/* ============ 初始渲染 ============ */
greet();
renderHome();
parseHash();
</script>
